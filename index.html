<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html,body{
  height: 200vh;
  overflow-x: hidden;
  scroll-behavior: auto;
  background:#040f1a;
}

/* ========== 首屏区域 ========== */
#hero-wrap{
  width: 100vw;
  height: 100vh;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
}
.cover-item{
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  filter: brightness(0.7);
  transition: opacity 1.2s ease-in-out;
  will-change: opacity, filter;
}
.cover-item.active{opacity:1;}
.logo-main{
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 30%;
  max-height: 16vh;
  pointer-events: none;
  will-change: transform, opacity;
}
.mask-top,.mask-bottom{
  position: absolute;
  left:0;
  width: 100vw;
  height: 50vh;
  background-color: #081838;
  opacity:0;
  will-change: transform, opacity;
}
.mask-top{top:0;transform-origin: top center;}
.mask-bottom{bottom:0;transform-origin: bottom center;}

/* ========== 第二页布局 ========== */
#content-wrap{
  width: 100vw;
  height: 100vh;
  position: absolute;
  top: 100vh;
  left:0;
  background: #040f1a;
  padding: 0;
}
.box-container{
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: row;
  gap: 4px;
  padding: 0;
}
.box-item{
  flex: 1;
  height: 100%;
  border-radius: 0;
  background-size: cover;
  background-position: center;
  transition: all 0.4s cubic-bezier(0.15,0,0.15,1);
  cursor: pointer;
  overflow: visible;
  will-change: transform, opacity, filter, flex;
  transform: translateY(80px);
  opacity: 0;
  filter: blur(12px);
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 40px;
  z-index: 1;
}
/* 容器hover触发子元素联动变化 */
.box-container:hover .box-item{
  flex: 0.8;
  opacity: 0.4;
  transform: scale(0.92);
}
.box-container .box-item:hover{
  flex: 1.6;
  opacity: 1;
  transform: scale(1) translateY(0);
  z-index: 3;
}
/* 底部图标 */
.box-icon{
  width: 60px;
  height: 60px;
  object-fit: contain;
  transition: 0.3s;
  position: relative;
}
/* 图标悬浮文字提示 */
.icon-tip{
  position: absolute;
  bottom: 75px;
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 6px 12px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.box-icon:hover + .icon-tip{
  opacity: 1;
}
</style>
</head>
<body>
<!-- 首屏容器 -->
<div id="hero-wrap">
  <div class="cover-item active" style="background-image:url(./img/fengmian2.png)"></div>
  <div class="cover-item" style="background-image:url(./img/fengmian3.png)"></div>
  <div class="cover-item" style="background-image:url(./img/fengmian4.png)"></div>
  <img class="logo-main" src="./img/logo.png">
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
</div>

<!-- 第二页7个横向区块 锚点id用于返回定位 -->
<div id="content-wrap">
  <div class="box-container">
    <!-- 第一个区块：点击跳转 tb1.html -->
    <div class="box-item" data-id="0" style="background-image:url(./img/bj.jpg)" onclick="location.href='tb1.html'">
      <img class="box-icon" src="./img/tb1.png">
      <div class="icon-tip">基本介绍</div>
    </div>
    <!-- 第二区块 跳转 tb2-1.html -->
    <div class="box-item" data-id="1" style="background-image:url(./img/bj1.jpg)" onclick="location.href='tb2-1.html'">
      <img class="box-icon" src="./img/tb2.png">
      <div class="icon-tip">农场经营</div>
    </div>
    <!-- 第三区块 跳转 tb3-1.html -->
    <div class="box-item" data-id="2" style="background-image:url(./img/bj2.jpg)" onclick="location.href='tb3-1.html'">
      <img class="box-icon" src="./img/tb3.png">
      <div class="icon-tip">环境变化</div>
    </div>
    <!-- 第四区块 新增跳转 tb4-1.html -->
    <div class="box-item" data-id="3" style="background-image:url(./img/bj3.jpg)" onclick="location.href='tb4-1.html'">
      <img class="box-icon" src="./img/tb4.png">
      <div class="icon-tip">交友小妙招</div>
    </div>
    <div class="box-item" data-id="4" style="background-image:url(./img/bj4.jpg)">
      <img class="box-icon" src="./img/tb5.png">
      <div class="icon-tip">你再猜猜我呢</div>
    </div>
    <div class="box-item" data-id="5" style="background-image:url(./img/bj5.jpg)">
      <img class="box-icon" src="./img/tb6.png">
      <div class="icon-tip">你猜我试试谁</div>
    </div>
    <div class="box-item" data-id="6" style="background-image:url(./img/bj6.jpg)">
      <img class="box-icon" src="./img/tb7.png">
      <div class="icon-tip">恭喜您中大奖了</div>
    </div>
  </div>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

// 封面自动轮播
const covers = document.querySelectorAll('.cover-item');
let coverIndex = 0;
let coverTimer = setInterval(autoCover,5000);
function autoCover(){
  covers[coverIndex].classList.remove('active');
  coverIndex = (coverIndex+1)%covers.length;
  covers[coverIndex].classList.add('active');
}

window.onload = function(){
  const anim = gsap.timeline({
    scrollTrigger:{
      trigger:"body",
      start:"top top",
      end:"140vh top",
      scrub:2.0,
      ease: "none",
      toggleActions:"play none none reverse",
      onEnter:()=>clearInterval(coverTimer),
      onLeaveBack:()=>{}
    }
  })
  // 1. Logo下滑消失
  anim.to('.logo-main',{y:150,opacity:0,duration:0.5})
  // 2. 遮罩显现
  anim.to(['.mask-top','.mask-bottom'],{opacity:1,duration:0.1})
  // 3. 封面模糊淡出+遮罩拉开
  anim.to('.cover-item',{filter:"brightness(0.2) blur(12px)",opacity:0,duration:0.9},"<")
  anim.to('.mask-top',{yPercent:-100,duration:0.9},"<")
  anim.to('.mask-bottom',{yPercent:100,duration:0.9},"<")
  // 首屏永久隐藏
  anim.to("#hero-wrap",{display:"none",duration:0},"+=0.2")
  // 第二页图片依次上滑清晰入场
  .to(".box-item", {
    y: 0,
    opacity: 1,
    filter: "blur(0px)",
    stagger: 0.15,
    duration: 0.8
  }, "-=0.2")
  ScrollTrigger.refresh();
}
</script>
</body>
</html>
